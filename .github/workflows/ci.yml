name: Creaturely CI

# Shared assets/brand changes intentionally continue to validate the Flutter app.
on:
  push:
    paths-ignore:
      - "site/**"
      - "infra/site/**"
      - ".github/workflows/site.yml"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "site/**"
      - "infra/site/**"
      - ".github/workflows/site.yml"
      - "**/*.md"

permissions:
  contents: read

env:
  FASTLANE_OPT_OUT_USAGE: "YES"
  FASTLANE_SKIP_UPDATE_CHECK: "YES"

concurrency:
  group: creaturely-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze, test, and build Android
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get --enforce-lockfile

      - name: Reproduce generated artifacts
        run: |
          flutter gen-l10n
          dart run build_runner build
          dart format lib/data/database.g.dart
          dart run tool/generate_icons.dart
          git diff --exit-code

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test tool

      - name: Analyze
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test --coverage --file-reporter json:test-results.json

      - name: Add test results to job summary
        if: ${{ !cancelled() && hashFiles('test-results.json') != '' }}
        uses: dorny/test-reporter@v3
        with:
          name: Flutter tests
          path: test-results.json
          reporter: flutter-json
          use-actions-summary: true
          list-tests: failed
          max-annotations: 0

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run integration journey
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          script: flutter test integration_test/creaturely_journey_test.dart -d emulator-5554

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: creaturely-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload coverage
        if: always() && hashFiles('coverage/lcov.info') != ''
        uses: actions/upload-artifact@v7
        with:
          name: creaturely-coverage
          path: coverage/lcov.info
          retention-days: 14

  release-config:
    name: Validate Fastlane release lanes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Parse Fastlane configuration
        run: bundle exec fastlane lanes

  ios:
    name: Build iOS simulator
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get --enforce-lockfile

      - name: Build unsigned iOS simulator app
        run: flutter build ios --simulator --debug --no-codesign
