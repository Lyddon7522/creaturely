name: Bug report
description: Tell us about a repeatable Creaturely problem without sharing private pet-health data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Creaturely. Please do not attach `.creaturely` backups, medical documents, animal names, or other private health information.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
      placeholder: I expected… but Creaturely…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the smallest repeatable sequence you can.
      placeholder: |
        1. Open…
        2. Tap…
        3. See…
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Both
        - Not sure
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS
      description: You can copy non-private technical details from Creaturely Settings.
      placeholder: Pixel 10 Pro, Android 16
  - type: input
    id: version
    attributes:
      label: Creaturely version
      placeholder: 1.0.0 (1)
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add a privacy-safe screenshot if it helps. Redact animal and medical details.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included backups, medical documents, or private pet-health data.
          required: true
