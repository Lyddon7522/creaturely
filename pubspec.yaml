name: creaturely
description: An open-source, local-first pet-health journal from Vector42.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  archive: ^4.3.0
  crypto: ^3.0.7
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  # Supports built-in Kotlin and win32 6.x, matching the share integration.
  file_picker: ^13.1.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.0
  font_awesome_flutter: ^11.0.0
  go_router: ^18.0.1
  image_picker: ^1.2.3
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.0
  share_plus: ^13.3.0
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.34.5
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  image: ^4.10.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - LICENSE
    - assets/brand/exports/
    - assets/fonts/Roboto-Bold.ttf
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto_LICENSE.txt
