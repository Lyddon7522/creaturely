name: creaturely
description: An open-source, local-first pet-health journal from Vector42.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.0.9
  collection: ^1.19.1
  crypto: ^3.0.7
  cupertino_icons: ^1.0.8
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  # 10.3.10 is the newest release compatible with Flutter's temporary
  # legacy-Kotlin mode required by flutter_local_notifications 22.x.
  file_picker: 10.3.10
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.2.0
  flutter_riverpod: ^2.6.1
  flutter_timezone: ^5.1.0
  go_router: ^17.3.0
  image_picker: ^1.2.3
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.0
  printing: ^5.15.0
  # 12.x remains compatible with file_picker's mobile-safe win32 constraint.
  share_plus: ^12.0.2
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.10.4
  drift_dev: ^2.34.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  image: ^4.9.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - LICENSE
    - assets/brand/exports/
    - assets/fonts/Roboto-Bold.ttf
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto_LICENSE.txt
