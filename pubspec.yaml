name: creaturely
description: An open-source, local-first pet-health journal from Vector42.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.0.9
  collection: ^1.19.1
  crypto: ^3.0.7
  cupertino_icons: ^1.0.9
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  # 12.x removes explicit KGP application and supports win32 6.x, which is
  # also required by the current share_plus release.
  file_picker: ^12.0.0-beta.7
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.2.0
  flutter_riverpod: ^2.6.1
  flutter_timezone: ^5.1.0
  font_awesome_flutter: ^11.0.0
  go_router: ^17.4.0
  image_picker: ^1.2.3
  intl: ^0.20.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.0
  printing: ^5.15.0
  share_plus: ^13.3.0
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  # Flutter 3.44 pins meta 1.18.0, so build_runner 2.15.1 is the newest
  # compatible release until the Flutter SDK advances that pin.
  build_runner: ^2.15.1
  drift_dev: ^2.34.5
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  image: ^4.9.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - LICENSE
    - assets/brand/exports/
    - assets/fonts/Roboto-Bold.ttf
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto_LICENSE.txt
